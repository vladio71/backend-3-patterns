# Повний стенд: postgres, redis, minio (+ створення бакета), jaeger, api, worker.
# Трейси: http://localhost:16686 (див. docs/tracing.md).
# nginx тут не додає нічого (один API-процес), тому API відкритий напряму на localhost:3002.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: patterns
      POSTGRES_PASSWORD: patterns
      POSTGRES_DB: patterns
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patterns"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]   # 9000 S3 API, 9001 веб-консоль
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Одноразовий контейнер: створює бакет product-images, якщо його ще немає.
  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/product-images &&
      echo 'bucket product-images ready'"

  # Jaeger v2 all-in-one: приймає OTLP на 4318 (HTTP) і 4317 (gRPC), UI на http://localhost:16686. Дані в пам'яті.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["16686:16686", "4318:4318"]

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
      # Трейсинг у Jaeger (OTLP/HTTP). Порожньо = вимкнено.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: api
    # Міграції, потім seed (ідемпотентний), потім API: усе з того самого образу.
    command: sh -c "node node_modules/typeorm/cli.js migration:run -d dist/src/data-source.js && node dist/scripts/seed.js && node dist/src/main.js"
    ports: ["3002:3002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: worker
    command: node dist/src/worker.js
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  miniodata:
