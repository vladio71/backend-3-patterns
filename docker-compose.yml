# Повний стенд: postgres, redis, minio (+ створення бакета), api, worker.
# nginx тут не додає нічого (один API-процес), тому API відкритий напряму на localhost:3002.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: patterns
      POSTGRES_PASSWORD: patterns
      POSTGRES_DB: patterns
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patterns"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]   # 9000 S3 API, 9001 веб-консоль
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Одноразовий контейнер: створює бакет product-images, якщо його ще немає.
  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/product-images &&
      echo 'bucket product-images ready'"

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
    # Міграції перед стартом: один раз, з того самого образу.
    command: sh -c "node node_modules/typeorm/cli.js migration:run -d dist/src/data-source.js && node dist/src/main.js"
    ports: ["3002:3002"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
    command: node dist/src/worker.js
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  miniodata:
