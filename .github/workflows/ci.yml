# CI: lint, build, unit, e2e. Для e2e Postgres і Redis піднімаються як service containers.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patterns
          POSTGRES_PASSWORD: patterns
          POSTGRES_DB: patterns_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U patterns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "5432"
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: "6379"
