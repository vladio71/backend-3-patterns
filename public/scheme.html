<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Схема проєкту</title>
  <!-- Excalidraw у режимі перегляду. Скрипт і стилі зібрані локально (npm run build:scheme), файл схеми: /scheme.excalidraw. -->
  <link rel="stylesheet" href="/scheme.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #fff; color: #1e1e1e; font: 15px/1.5 Inter, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { html, body { background: #111317; color: #e6e8eb; } }
    header { height: 48px; display: flex; align-items: center; gap: 18px; padding: 0 18px; border-bottom: 1px solid #8884; }
    header a { color: inherit; opacity: .8; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    header .hint { opacity: .6; font-size: 13px; }
    #root { position: absolute; top: 49px; left: 0; right: 0; bottom: 0; }
    .note { position: absolute; bottom: 8px; left: 12px; font-size: 12px; opacity: .6; pointer-events: none; }
    /* кнопка меню Excalidraw у режимі перегляду зайва */
    .excalidraw .App-menu_top .dropdown-menu-button, .excalidraw .main-menu-trigger { display: none !important; }
  </style>
</head>
<body>
  <header>
    <b>Схема проєкту</b>
    <span class="hint">зум колесом, пан затиснувши пробіл або колесо</span>
    <a href="/reference">контракт API</a>
    <a href="/health">health</a>
  </header>
  <div id="root"></div>
  <div class="note">Той самий файл лежить у docs/architecture.excalidraw, редагувати можна на excalidraw.com</div>
  <script type="module" src="/scheme.js"></script>
</body>
</html>
